<script>
const ALL=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const NICKS={INTJ:"建築家",INTP:"論理学者",ENTJ:"指揮官",ENTP:"討論者",INFJ:"提唱者",INFP:"仲介者",ENFJ:"主人公",ENFP:"広報運動家",ISTJ:"管理者",ISFJ:"擁護者",ESTJ:"幹部",ESFJ:"領事",ISTP:"巨匠",ISFP:"冒険家",ESTP:"起業家",ESFP:"エンターテイナー"};

const CD={

  ESTJ:{INTJ:2,INTP:3,ENTJ:3,ENTP:2,INFJ:2,INFP:2,ENFJ:3,ENFP:2,ISTJ:4,ISFJ:3,ESTJ:3,ESFJ:4,ISTP:5,ISFP:5,ESTP:4,ESFP:3},
  ESFJ:{INTJ:1,INTP:2,ENTJ:2,ENTP:2,INFJ:2,INFP:3,ENFJ:3,ENFP:3,ISTJ:3,ISFJ:4,ESTJ:4,ESFJ:3,ISTP:5,ISFP:5,ESTP:3,ESFP:4},
  ISTP:{INTJ:3,INTP:4,ENTJ:3,ENTP:3,INFJ:2,INFP:2,ENFJ:2,ENFP:2,ISTJ:3,ISFJ:3,ESTJ:5,ESFJ:5,ISTP:3,ISFP:4,ESTP:4,ESFP:3},
  ISFP:{INTJ:2,INTP:2,ENTJ:4,ENTP:2,INFJ:3,INFP:3,ENFJ:5,ENFP:3,ISTJ:3,ISFJ:4,ESTJ:5,ESFJ:5,ISTP:4,ISFP:3,ESTP:3,ESFP:4},
  ESTP:{INTJ:2,INTP:3,ENTJ:3,ENTP:3,INFJ:1,INFP:2,ENFJ:2,ENFP:2,ISTJ:5,ISFJ:5,ESTJ:4,ESFJ:3,ISTP:4,ISFP:3,ESTP:3,ESFP:4},
  ESFP:{INTJ:1,INTP:2,ENTJ:2,ENTP:2,INFJ:2,INFP:3,ENFJ:3,ENFP:3,ISTJ:5,ISFJ:5,ESTJ:3,ESFJ:4,ISTP:3,ISFP:4,ESTP:4,ESFP:3},

// スコア別の基本コメント
const BASE={
  5:{label:"運命的な相性 💫",hearts:"♥♥♥♥♥",good:"心理機能が自然に補い合い、お互いの弱点を強みでカバーできる理想的な組み合わせ。最初から会話が弾み、価値観の共鳴を感じやすいでしょう。",bad:"相性が良すぎるため依存しすぎる危険も。適度な距離感を保つことが長続きの秘訣です。"},
  4:{label:"相性良好 ✨",hearts:"♥♥♥♥☆",good:"多くの価値観が一致し、一緒にいて心地よい安心感がある組み合わせ。理解し合えるポイントが多く、自然に関係が深まります。",bad:"似ている部分が多い反面、同じ弱点も持ちやすい。意識的に異なる視点を取り入れると成長できます。"},
  3:{label:"標準的な相性 🌙",hearts:"♥♥♥☆☆",good:"お互いに学び合える部分がある組み合わせ。最初は違和感を感じることもありますが、理解が深まると安定した関係になれます。",bad:"コミュニケーションスタイルの違いが誤解を生むことも。意図を丁寧に伝え合う習慣をつけましょう。"},
  2:{label:"努力が必要 🌧️",hearts:"♥♥☆☆☆",good:"表面的には違いが多く見えますが、お互いに惹かれる「異質さ」がある組み合わせ。努力次第でユニークな関係を築けます。",bad:"価値観や行動スタイルの違いから衝突しやすい。思い込みで判断せず、相手の視点を尊重する姿勢が必要です。"},
  1:{label:"難関の相性 ⚡",hearts:"♥☆☆☆☆",good:"非常に異なるタイプですが、だからこそお互いが持っていないものを持ち寄れます。乗り越えれば最強のパートナーになれる可能性も。",bad:"根本的な価値観・行動スタイルの違いが大きく、無意識のすれ違いが多くなりがちです。"},
};

// タイプ別の特性（軸ごと）
const AXIS_TRAITS={
  E:"社交的・エネルギッシュ・積極的",I:"内省的・深く考える・一対一を好む",
  S:"現実的・具体的・経験を重視",N:"直感的・抽象的・可能性を重視",
  T:"論理的・客観的・原則重視",F:"共感的・調和重視・感情を大切に",
  J:"計画的・秩序を好む・決断が早い",P:"柔軟・自発的・選択肢を残す",
};

// タイプ組み合わせ別のラッキーアイテム・デートスポット・アドバイス
const PAIR_DATA={
  "5":{
    lucky:["ムーンストーン","ラベンダーのアロマ","満月の夜のロウソク"],
    date:"静かな星空観察スポット・アンティークカフェ・美術館の夜間開放",
    advice:["初デートは二人だけの空間を選ぶと本来の魅力が伝わります","共通の「秘密の場所」を作ると絆が一気に深まります","相手の価値観を否定せず「そういう見方もあるね」と受け入れる姿勢が鍵"]
  },
  "4":{
    lucky:["ローズクォーツ","お気に入りの本","ペアのマグカップ"],
    date:"共通の趣味を活かしたアクティビティ・こだわりのカフェ巡り・朝市",
    advice:["共通の趣味や興味を見つけることで関係がさらに加速します","「ありがとう」を言葉にして伝える習慣が二人の仲を育てます","忙しくても週1回は二人の時間を確保しましょう"]
  },
  "3":{
    lucky:["アメジスト","共通の映画・音楽","手書きのメモ"],
    date:"会話が弾むボードゲームカフェ・料理教室・ドライブ",
    advice:["相手の「違い」を個性として楽しむ視点が関係を豊かにします","意見が合わないときこそ「なぜそう思う？」と興味を持って聞きましょう","定期的に二人の「いいところ」を言い合う習慣をつけると◎"]
  },
  "2":{
    lucky:["タイガーアイ","共通の目標メモ","温かいお茶のギフト"],
    date:"一緒に何かを作る体験型ワークショップ・ハイキング・料理対決",
    advice:["最初から全てを理解し合おうとせず「少しずつ」を大切に","相手が大切にしているものを一つ覚えて話題にしてみましょう","喧嘩したら24時間置いてから話し合うと解決しやすくなります"]
  },
  "1":{
    lucky:["ヘマタイト","お互いの好きな食べ物","ユーモアのある絵葉書"],
    date:"非日常を共有できる体験（エスケープルームなど）・フードフェス・ライブ",
    advice:["お互いの「当たり前」が違うことを最初に認め合いましょう","小さな歩み寄りを積み重ねることで信頼が生まれます","共通の「敵」（映画の悪役・難しいゲームなど）を設定すると団結力が生まれます"]
  }
};

function initSelects(){
  const groups=[
    {label:"分析家（NT）",types:["INTJ","INTP","ENTJ","ENTP"]},
    {label:"外交官（NF）",types:["INFJ","INFP","ENFJ","ENFP"]},
    {label:"番人（SJ）",  types:["ISTJ","ISFJ","ESTJ","ESFJ"]},
    {label:"探検家（SP）",types:["ISTP","ISFP","ESTP","ESFP"]},
  ];
  ['ta','tb'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">選択してください</option>';
    groups.forEach(g=>{
      const og=document.createElement('optgroup');
      og.label=g.label;
      g.types.forEach(t=>{
        const op=document.createElement('option');
        op.value=t;op.textContent=`${t}（${NICKS[t]}）`;
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
  });
}

function check(){
  const a=document.getElementById('ta').value;
  const b=document.getElementById('tb').value;
  if(!a||!b){alert('両方のタイプを選んでください！');return;}
  const score=CD[a][b];
  const base=BASE[score];
  const pd=PAIR_DATA[String(score)];
  const nA=NICKS[a],nB=NICKS[b];

  // 軸の共通点・相違点を分析
  const shared=[], diff=[];
  for(let i=0;i<4;i++){
    if(a[i]===b[i]) shared.push(a[i]);
    else diff.push([a[i],b[i]]);
  }
  const sharedText=shared.length?shared.map(x=>AXIS_TRAITS[x]).join('・'):'なし（全軸が異なります）';
  const diffText=diff.length?diff.map(d=>`${d[0]}(${AXIS_TRAITS[d[0]]}) vs ${d[1]}(${AXIS_TRAITS[d[1]]})`).join('<br>'):'なし（完全に同タイプ）';

  document.getElementById('rc').innerHTML=`
    <div class="rt">
      <div><div class="rb">${a}</div><div class="rn">（${nA}）</div></div>
      <span style="font-size:1.6rem;">💕</span>
      <div><div class="rb">${b}</div><div class="rn">（${nB}）</div></div>
    </div>
    <div class="rscore">
      <div class="num">${score}<span style="font-size:1.5rem;color:var(--text-muted)">/5</span></div>
      <div class="hearts">${base.hearts}</div>
      <div class="rlabel">${base.label}</div>
    </div>
    <div class="secs">
      <div class="sec">
        <h3>✅ 相性の良いポイント</h3>
        <p>${base.good}</p>
      </div>
      <div class="sec">
        <h3>🔍 二人の共通点</h3>
        <p>${sharedText}</p>
      </div>
      <div class="sec">
        <h3>⚡ 二人の違い（成長のチャンス）</h3>
        <p style="font-size:.82rem;line-height:2;">${diffText}</p>
      </div>
      <div class="sec">
        <h3>⚠️ 注意すべきポイント</h3>
        <p>${base.bad}</p>
      </div>
      <div class="sec">
        <h3>🎁 二人のラッキーアイテム</h3>
        <div class="lucky-row">
          ${pd.lucky.map(l=>`<span class="lbadge">✨ ${l}</span>`).join('')}
        </div>
        <p style="font-size:.8rem;color:var(--text-muted);margin-top:10px;">💑 おすすめデートスポット：${pd.date}</p>
      </div>
      <div class="sec">
        <h3>💡 うまくいくための3つのアドバイス</h3>
        <ul class="advice-list">
          ${pd.advice.map(a=>`<li>${a}</li>`).join('')}
        </ul>
      </div>
    </div>`;
  document.getElementById('result').style.display='';
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderMatrix(){
  const tbl=document.getElementById('mx');
  let html='<tr><th></th>';
  ALL.forEach(t=>html+=`<th>${t}</th>`);
  html+='</tr>';
  ALL.forEach(a=>{
    html+=`<tr><th>${a}</th>`;
    ALL.forEach(b=>{
      const s=CD[a][b];
      html+=`<td class="s${s}" onclick="quick('${a}','${b}')" title="${a}×${b}：${s}/5">${s}</td>`;
    });
    html+='</tr>';
  });
  tbl.innerHTML=html;
}

function quick(a,b){
  document.getElementById('ta').value=a;
  document.getElementById('tb').value=b;
  check();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('load',()=>{
  initSelects();
  renderMatrix();
  const p=new URLSearchParams(location.search);
  const t=p.get('type');
  if(t&&CD[t]) document.getElementById('ta').value=t;
});
</script>
</body>
</html>
